<section class="rsvp-page">
  <h1>RSVP</h1>
  <p class="adults-only-note">Please note this is an adults-only celebration.</p>

  

  <!-- RSVP Form -->
  <!-- data-netlify="true" registers this form with Netlify Forms at deploy time.
       action points to a fallback thank-you page if JS doesn't run.
       The hidden "bot-field" is Netlify's honeypot spam filter. -->
  <form id="rsvp-form" class="rsvp-form" name="rsvp" method="POST"
        data-netlify="true" netlify-honeypot="bot-field" action="/thank-you.html">
    <input type="hidden" name="form-name" value="rsvp">
    <p style="display:none;">
      <label>Don't fill this out if you're human: <input name="bot-field"></label>
    </p>

    <!-- Pre-filled from token -->
    <div class="form-group">
      <label for="name">Name</label>
      <input type="text" id="name" name="name">
    </div>

    <!-- Attendance -->
    <div class="form-group">
      <label>Will you attend?</label>
      <div class="radio-group">
        <input type="radio" id="yes" name="attendance" value="yes" required>
        <label for="yes">✅ Joyfully Accepts</label>
        
        <input type="radio" id="no" name="attendance" value="no">
        <label for="no">❌ Regretfully Declines</label>
      </div>
    </div>

    <!-- Plus One Count (if applicable) 
    <div class="form-group" id="plus-one-section">
      <label for="plus-one">Number of Guests (including you)</label>
      <select id="plus-one" name="plus-one">
        <option value="1">1</option>
        <option value="2">2</option>
      </select>
    </div>
-->
    <!-- Email -->
    <div class="form-group">
      <label for="email">Email (for confirmation)</label>
      <input type="email" id="email" name="email" required>
    </div>

    <!-- Dietary Restrictions 
    <div class="form-group">
      <label for="dietary">Dietary Restrictions (optional)</label>
      <textarea id="dietary" name="dietary" 
                placeholder="Vegetarian, allergies, etc."></textarea>
    </div>
-->
    <!-- Message to Couple -->
    <div class="form-group">
      <label for="message">Message to the Couple (optional)</label>
      <textarea id="message" name="message" 
                placeholder="We're so excited to celebrate with you!"></textarea>
    </div>

    <!-- Submit Button -->
    <button type="submit" class="submit-button">Submit RSVP</button>
  </form>

  <!-- Success message shown after submitting -->
  <div id="rsvp-success" class="rsvp-success" hidden>
    <span class="rsvp-success-icon">💌</span>
    <p>Thank you! Your RSVP has been received. We can’t wait to see you!</p>
  </div>
</section>

<!-- Toast pop-up notification -->
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<!-- Footer -->
    <footer class="footer">
        <p>With Love, Uyen & Antonio | 2026</p>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
